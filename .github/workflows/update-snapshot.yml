name: Build OSRS merch analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'build_desk_packet.py'
      - 'augment_desk_packet.py'
      - 'augment_profit_packet.py'
      - 'augment_execution_features.py'
      - 'optimize_execution_prices.py'
      - 'real_execution_learning.py'
      - 'update_spread_persistence.py'
      - 'optimize_allocation.py'
      - 'portfolio_exit_engine.py'
      - 'update_opportunity_book.py'
      - 'build_speculative_parks.py'
      - 'build_market_radar.py'
      - 'build_swing_trade_gate.py'
      - 'build_tfa_unique_economics.py'
      - 'build_desk_lite.py'
      - 'inject_speculative_parks.py'
      - 'shadow_book.py'
      - 'sanitize_shadow_book.py'
      - 'archive_snapshot.py'
      - 'collect_related.py'
      - 'collect_staples.py'
      - 'collect_portfolio_history.py'
      - 'freshness_guard.py'
      - 'project/**'
      - 'tests/**'
      - '.github/workflows/update-snapshot.yml'

concurrency:
  group: osrs-analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure relay bot
        run: |
          git config user.name "osrs-merch-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Require fresh live tape
        run: |
          git pull --rebase origin main
          python freshness_guard.py --max-age-seconds 600 --require-fresh

      - name: Run profit-engine tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Refresh derived inputs
        run: |
          python collect_related.py || true
          python collect_staples.py || true
          python collect_portfolio_history.py || true

      - name: Build analytics
        run: |
          python build_desk_packet.py
          python augment_desk_packet.py || true
          python sanitize_shadow_book.py || true
          python shadow_book.py || true
          python real_execution_learning.py || true
          python update_spread_persistence.py || true
          python augment_profit_packet.py || true
          python augment_execution_features.py || true
          python optimize_execution_prices.py || true
          python optimize_allocation.py || true
          python update_opportunity_book.py || true
          python portfolio_exit_engine.py
          python build_market_radar.py
          python build_desk_lite.py
          python build_speculative_parks.py || true
          python inject_speculative_parks.py || true
          python build_swing_trade_gate.py || true
          python build_tfa_unique_economics.py || true
          python archive_snapshot.py || true
          python freshness_guard.py --max-age-seconds 600 --require-fresh

      - name: Commit analytics
        shell: bash
        run: |
          set -euo pipefail
          git add desk_packet.json desk_packet_lite.json related_watch.json staples_watch.json portfolio_history.json \
            speculative_park_snapshot.json market_radar.json swing_trade_gate.json tfa_unique_economics.json \
            profit_snapshot.json shadow_book.json shadow_book_summary.json real_execution_summary.json \
            spread_persistence.json opportunity_book.json market_freshness.json history/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update OSRS merch analytics"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
