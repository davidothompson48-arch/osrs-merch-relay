name: Update OSRS market snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'collect_related.py'
      - 'collect_staples.py'
      - 'collect_universe.py'
      - 'archive_snapshot.py'
      - 'project/related_items.json'
      - 'project/evergreen_staples.json'
      - '.github/workflows/update-snapshot.yml'
  schedule:
    # GitHub's scheduler is best-effort. These staggered watchdog starts are
    # intentionally less frequent; each started job maintains a 5-minute loop.
    - cron: '7,37 * * * *'

concurrency:
  group: osrs-market-relay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # A running watchdog keeps refreshing even when GitHub delays later cron events.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure relay bot
        run: |
          git config user.name "osrs-merch-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Maintain five-minute RuneLite relay
        shell: bash
        run: |
          set -u

          retry() {
            local attempts="$1"
            shift
            local n=1
            while ! "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              sleep $((n * 8))
              n=$((n + 1))
            done
          }

          commit_and_push() {
            local message="$1"
            shift
            git add -- "$@"
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "$message"
            for push_attempt in 1 2 3; do
              if git push origin HEAD:main; then
                return 0
              fi
              git pull --rebase origin main
              sleep $((push_attempt * 5))
            done
            return 1
          }

          # 66 cycles ~= 5.5 hours. Normal :07/:37 watchdog starts replace this
          # job, but if GitHub skips a scheduled start the existing job keeps going.
          for cycle in $(seq 1 66); do
            cycle_started=$(date +%s)
            echo "=== Relay cycle $cycle started $(date -u +%FT%TZ) ==="

            # Begin each cycle from current main so project-state edits and other
            # legitimate commits do not make the relay push non-fast-forward.
            git reset --hard HEAD
            git pull --rebase origin main

            # Core tape is the execution-critical feed and refreshes every cycle.
            if ! retry 4 python collect.py; then
              echo "Core RuneLite/Wiki collection failed this cycle"
            else
              commit_and_push "Update fresh OSRS core tape" snapshot.json relay_health.json || true
            fi

            # Sector watch also refreshes every five minutes.
            if ! retry 3 python collect_related.py; then
              echo "Related-sector collection failed this cycle; retaining prior file"
            fi

            # Evergreen consumables are a slower mean-reversion scan. Run on cycle
            # 1 and every 12th cycle (~hourly) so 30d timeseries checks do not hammer
            # the Wiki API while still matching the hourly merch-desk cadence.
            if [ "$cycle" -eq 1 ] || [ $((cycle % 12)) -eq 0 ]; then
              if ! retry 2 python collect_staples.py; then
                echo "Evergreen-staple collection failed this cycle; retaining prior file"
              fi
            fi

            # The full 4.6k-item universe is heavier. Refresh it on cycle 1 and
            # every third cycle (~15m); current holdings/sectors remain 5m fresh.
            if [ "$cycle" -eq 1 ] || [ $((cycle % 3)) -eq 0 ]; then
              if ! retry 3 python collect_universe.py; then
                echo "Full-universe collection failed this cycle; retaining prior shards"
              fi
            fi

            if ! python archive_snapshot.py; then
              echo "History archive failed this cycle"
            fi

            commit_and_push "Update OSRS market data and history" \
              snapshot.json relay_health.json related_watch.json staples_watch.json market_universe/ \
              history/market_history.jsonl history/recent_history.json || true

            cycle_finished=$(date +%s)
            elapsed=$((cycle_finished - cycle_started))
            sleep_for=$((300 - elapsed))
            if [ "$sleep_for" -gt 0 ]; then
              echo "Cycle finished in ${elapsed}s; sleeping ${sleep_for}s"
              sleep "$sleep_for"
            else
              echo "Cycle took ${elapsed}s; starting next cycle immediately"
            fi
          done
