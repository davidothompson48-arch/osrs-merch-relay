name: Update OSRS market snapshot

on:
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - '.github/workflows/update-snapshot.yml'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RuneLite/Wiki market data
        run: python collect.py

      - name: Commit snapshot if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "osrs-merch-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Update OSRS market snapshot"
          git push
