name: Update OSRS market snapshot

on:
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'collect_related.py'
      - 'collect_universe.py'
      - 'archive_snapshot.py'
      - 'project/related_items.json'
      - '.github/workflows/update-snapshot.yml'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: osrs-market-relay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch core RuneLite/Wiki market data
        run: |
          for attempt in 1 2 3 4; do
            python collect.py && break
            if [ "$attempt" = "4" ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Commit fresh core tape immediately
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "osrs-merch-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json relay_health.json
          if git diff --cached --quiet; then
            echo "No core market-data changes"
          else
            git commit -m "Update fresh OSRS core tape"
            git push
          fi

      - name: Fetch related-sector RuneLite/Wiki market data
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            python collect_related.py && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 8))
          done

      - name: Fetch readable full-market RuneLite/Wiki universe
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            python collect_universe.py && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 8))
          done

      - name: Archive compact market history
        run: python archive_snapshot.py

      - name: Commit secondary market data if changed
        if: github.event_name != 'pull_request'
        run: |
          git add snapshot.json relay_health.json related_watch.json market_universe/ history/market_history.jsonl history/recent_history.json
          if git diff --cached --quiet; then
            echo "No secondary market-data changes"
            exit 0
          fi
          git commit -m "Update OSRS market data and history"
          git push
