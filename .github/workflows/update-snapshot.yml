name: Update OSRS market snapshot

on:
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'collect_related.py'
      - 'collect_universe.py'
      - 'archive_snapshot.py'
      - 'project/related_items.json'
      - '.github/workflows/update-snapshot.yml'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch core RuneLite/Wiki market data
        run: python collect.py

      - name: Fetch related-sector RuneLite/Wiki market data
        run: python collect_related.py

      - name: Fetch compact full-market RuneLite/Wiki universe
        run: python collect_universe.py

      - name: Archive compact market history
        run: python archive_snapshot.py

      - name: Commit market data if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "osrs-merch-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json related_watch.json market_universe.json history/market_history.jsonl history/recent_history.json
          if git diff --cached --quiet; then
            echo "No market data changes"
            exit 0
          fi
          git commit -m "Update OSRS market data and history"
          git push
