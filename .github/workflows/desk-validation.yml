name: OSRS desk validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'project/*.json'
      - 'tests/**'
      - '.github/workflows/desk-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python desk modules
        run: python -m compileall -q *.py tests/
      - name: Run all deterministic unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
