name: Super Combat Margin Scanner
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/super_combat_margins.py'
      - '.github/workflows/super-combat-margins.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: super-combat-margin-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate live super combat margins
        env:
          OSRS_USER_AGENT: osrs-merch-relay/1.0 (github.com/davidothompson48-arch/osrs-merch-relay)
        run: python scripts/super_combat_margins.py
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add super_combat_margins.json
          if ! git diff --cached --quiet; then
            git commit -m "Update super combat margin snapshot"
            git push
          fi
